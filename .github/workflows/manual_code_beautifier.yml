name: "Manual - php code beautifier"

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Base branch'
        required: true
        default: 'beta7'
      beautified_branch:
        description: 'Branch name for beautified code'
        required: true
        default: 'app-core/beautified-code'

jobs:
  beautify-code:
    runs-on: eks-small
    steps:
      - name: Checkout module ${{ github.event.inputs.branch }}
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
        env:
          runner: self-hosted

      - name: set $HOME
        run: echo "HOME=$(pwd)" >> $GITHUB_ENV

      - name: Run PSR-12 coding standard
        continue-on-error: true
        run: |
          composer global require squizlabs/php_codesniffer --no-interaction
          $(composer config --global home)/vendor/bin/phpcbf --standard=PSR12 --ignore=database ${{ github.workspace }}/src

      - name: Commit changes
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Action"
          git checkout -b "${{ github.event.inputs.beautified_branch }}"
          git add *
          git commit -m "update with code beautifier" --author="GitHub Action <97729118+plenty-cicd-1@users.noreply.github.com>"
          git push origin "${{ github.event.inputs.beautified_branch }}"

      - name: Create pull request
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.ORGA_PAT_CICD1_FULL_REPO_AND_PACKAGES }}
          script: |
            github.rest.pulls.create({
              owner: "plentymarkets",
              repo: "${{ github.event.repository.name }}",
              head: "${{ github.event.inputs.beautified_branch }}",
              base: "${{ github.event.inputs.branch }}",
              title: "chore: update with code beautifier"
            })
