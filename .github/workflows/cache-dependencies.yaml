####  DO NOT MODIFY!      ####
##############################
name: cache PL vendor dependencies

on:
  # In order to be able to trigger it during the weekly release
  workflow_dispatch:

  # Check each commit on production branches
  push:
    branches:
      - beta7
      - early
      - stable7

env:
  COMPOSER_HOME: "$HOME/.config/composer/vendor/bin"
  APP_ENV: testing
  IS_JENKINS: true
  PLENTY_ID_HASH: 1000
  WORKSPACE: ${{ github.workspace }}

jobs:
  cache:
    runs-on: eks-large
    steps:
      - uses: plentymarkets/github-runner-cleanup@main

      - name: Checkout github-actions repo
        uses: actions/checkout@v4
        with:
          repository: plentymarkets/github-actions
          ref: main
          token: ${{ secrets.ORGA_PAT_CICD3_FULL_REPO_AND_PACKAGES }}
          path: .tmp/github-actions

      - name: Extract branch name
        shell: bash
        run: |
          HEAD_REF=${GITHUB_REF#refs/heads/}
          REF_NAME=${GITHUB_REF#refs/*/}
          if [[ "$REF_NAME" != "stable7" && "$REF_NAME" != "early" && "$REF_NAME" != "beta7" ]]; then
            echo "no cache needed for branch $REF_NAME"
            exit 1
          fi
          echo "branch=${REF_NAME}" >> $GITHUB_OUTPUT
        id: extract_branch

      - name: Setup PHP with tools
        uses: shivammathur/setup-php@2.25.2
        with:
          php-version: 8.0
          extensions: ast, gd, soap, redis
          coverage: none
        env:
          COMPOSER_TOKEN: ${{ secrets.ORGA_PAT_CICD3_FULL_REPO_AND_PACKAGES }}
          runner: self-hosted

      - name: Checkout PL
        uses: actions/checkout@v4
        with:
          repository: "plentymarkets/php-pl"
          token: ${{ secrets.ORGA_PAT_CICD3_FULL_REPO_AND_PACKAGES }}
          path: "pl"
          ref: ${{ steps.extract_branch.outputs.branch }}

      - name: Install dependencies
        shell: bash
        working-directory: pl
        run: |
          rm -f bootstrap/cache/services.php
          rm -f bootstrap/cache/packages.php
          composer install --no-progress --no-scripts
          
      - name: Cleanup old cache
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
        run: |
          gh extension install actions/gh-actions-cache
          
          REPO=${{ github.repository }}
          BRANCH=${{ github.ref }}

          gh actions-cache delete composer-pl-${{ steps.extract_branch.outputs.branch }} -R $REPO -B $BRANCH --confirm

      - name: Cache pl dependencies
        uses: actions/cache@v4
        with:
          path: "pl/vendor"
          key: composer-pl-${{ steps.extract_branch.outputs.branch }}
