####  AUTOGENERATED       ####
####  DO NOT MODIFY!      ####
##############################
name: "Rector code refactoring"

env:
  COMPOSER_HOME: "$HOME/.config/composer"
  BRANCH: ""
  REFACTORED_BRANCH: ""
  RECTOR_RUN_TYPE: ""

on:
  pull_request:
    branches: [beta7, early, stable7]
    types: [opened, synchronize, edited, labeled]
    
  workflow_dispatch:
    inputs:
      branch:
        description: 'Base branch'
        required: true
        default: 'beta7'
      refactored_branch:
        description: 'Branch name for the refactored code'
        required: true
        default: 'rector-refactored-code'
      rector_run_type:
        description: 'Type of rector run'
        required: true
        type: choice
        options:
          - dry_run
          - refactor
        default: 'refactor'
      run_php_cs_fixer:
        description: 'Run PHP CS Fixer and formatter'
        type: boolean
        required: false
        default: true
      run_phpcbf:
        description: 'Run PHP Code Beautifier and Fixer'
        type: boolean
        required: false
        default: true
        
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  refactor-code:
    env:
      STATUS_FILE: test.rector.status
      REQUIRED: false
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ["eks-large"]
    steps:
      - name: Set Run Parameters
        id: parameters
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "Trigger: Manual Dispatch"
            echo "BRANCH=${{ github.event.inputs.branch }}" >> $GITHUB_ENV
            echo "REFACTORED_BRANCH=${{ github.event.inputs.refactored_branch }}" >> $GITHUB_ENV
            echo "RECTOR_RUN_TYPE=${{ github.event.inputs.rector_run_type }}" >> $GITHUB_ENV
            echo "RUN_PHP_CS_FIXER=${{ github.event.inputs.run_php_cs_fixer }}" >> $GITHUB_ENV
            echo "RUN_PHPCBF=${{ github.event.inputs.run_phpcbf }}" >> $GITHUB_ENV

          else
            echo "Trigger: PR / Label added"
            echo "RECTOR_RUN_TYPE=dry_run" >> $GITHUB_ENV
            echo "BRANCH=${{ github.event.pull_request.head.ref}}" >> $GITHUB_ENV
            echo "REFACTORED_BRANCH=${{ github.event.pull_request.head.ref }}_refactored" >> $GITHUB_ENV
            echo "RUN_PHP_CS_FIXER=true" >> $GITHUB_ENV
            echo "RUN_PHPCBF=true" >> $GITHUB_ENV

            if [[ "${{ contains(github.event.pull_request.labels.*.name, 'run-rector') }}" == "true" ]]; then
              echo "RECTOR_RUN_TYPE=refactor" >> $GITHUB_ENV
            fi
          fi

      - name: Checkout PL beta7
        uses: actions/checkout@v4
        with:
          repository: "plentymarkets/php-pl"
          token: ${{ secrets.ORGA_PAT_CICD1_FULL_REPO_AND_PACKAGES }}
          ref: 'beta7'
          path: pl

      - name: Checkout PY beta7
        uses: actions/checkout@v4
        with:
          repository: "plentymarkets/php-py"
          token: ${{ secrets.ORGA_PAT_CICD1_FULL_REPO_AND_PACKAGES }}
          ref: 'beta7'
          path: py

      - name: Checkout PS beta7
        uses: actions/checkout@v4
        with:
          repository: "plentymarkets/php-ps"
          token: ${{ secrets.ORGA_PAT_CICD1_FULL_REPO_AND_PACKAGES }}
          ref: 'beta7'
          path: ps

      - name: Checkout module ${{ github.repository }} ${{ env.BRANCH }}
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          path: module

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
        env:
          COMPOSER_TOKEN: ${{ secrets.ORGA_PAT_CICD1_FULL_REPO_AND_PACKAGES }}
          runner: 'self-hosted'

      - name: Cache pl dependencies
        uses: actions/cache@v4
        with:
          path: "pl/vendor"
          key: composer-pl-beta7
          restore-keys: composer-pl-stable7
          enableCrossOsArchive: true
  
      - name: Install dependencies
        shell: bash
        working-directory: pl
        run: |
          rm -f bootstrap/cache/services.php
          rm -f bootstrap/cache/packages.php
          composer install --no-progress --no-scripts
          php artisan package:discover
          php artisan passport:keys
          touch .env

      - name: Get changed files
        if: github.event_name == 'pull_request'
        id: changed-php-files
        uses: tj-actions/changed-files@v46
        with:
          files: |
            **/*.php

      - name: Dry run rector
        shell: bash
        id: rector-dry-run
        if: env.RECTOR_RUN_TYPE == 'dry_run'
        working-directory: module
        run: |
          STATUS_CODE=0
          if ../pl/vendor/bin/rector process ${{ steps.changed-php-files.outputs.all_changed_files }} --dry-run --no-progress-bar --output-format=github --config rector.php; then
            echo "Rector ran successfully with no changes needed."
          else
            STATUS_CODE=$?
            echo "Rector found issues and exited with status code: $STATUS_CODE"
          fi
          echo "exit_code=$STATUS_CODE" >> $GITHUB_OUTPUT
          exit $STATUS_CODE

      - name: Create or update rector dry-run comment
        uses: peter-evans/create-or-update-comment@v4
        if: always() && env.RECTOR_RUN_TYPE == 'dry_run' && steps.rector-dry-run.outputs.exit_code == 2 && github.event_name == 'pull_request'
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ### 🤖 Rector dry-run results
            Rector has found potential improvements in the changed files.

            Add label [run-rector](https://github.com/${{ github.repository }}/labels?q=run-rector) to refactor this PR.
      
      - name: Run rector
        if: env.RECTOR_RUN_TYPE == 'refactor'
        continue-on-error: true
        working-directory: module
        run: |
          ../pl/vendor/bin/rector process ${{ steps.changed-php-files.outputs.all_changed_files }} --no-progress-bar --output-format=github --config rector.php

      - name: Run php-cs-fixer
        if: env.RECTOR_RUN_TYPE == 'refactor' && env.RUN_PHP_CS_FIXER == 'true'
        working-directory: module
        run: |
         ../pl/vendor/bin/php-cs-fixer fix ${{ steps.changed-php-files.outputs.all_changed_files }} --config=.php-cs-fixer.php || true

      - name: Run phpcbf
        if: env.RECTOR_RUN_TYPE == 'refactor' && env.RUN_PHPCBF == 'true'
        working-directory: module
        run: |
          FILES="${{ steps.changed-php-files.outputs.all_changed_files }}"
          ../pl/vendor/bin/phpcbf --extensions=php --standard=PSR12 -n ${FILES:-src} || true

      - name: Create pull request
        id: cpr
        uses: peter-evans/create-pull-request@v7
        if: env.RECTOR_RUN_TYPE == 'refactor'
        with:
          token: ${{ secrets.ORGA_PAT_CICD1_FULL_REPO_AND_PACKAGES }}
          branch: ${{ env.REFACTORED_BRANCH }}
          base: ${{ env.BRANCH }}
          path: module
          commit-message: "rector, php-cs-fixer and phpcbf"
          title: "chore: Rector, php-cs-fixer and phpcbf"
          body: "Rector created this pull request with proposed changes for this PR: [${{ github.event.pull_request.title }}](${{ github.event.pull_request.html_url }})"
          delete-branch: true
          add-paths: |
            src/**/*.php
      
      - name: Create or update rector comment
        uses: peter-evans/create-or-update-comment@v4
        if: env.RECTOR_RUN_TYPE == 'refactor' && github.event_name == 'pull_request'
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          comment-id: ${{ steps.fc.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            Rector and code beautifier have been applied.
            You can review the changes in this PR:
              
            [chore: rector and code beautifier](${{ steps.cpr.outputs.pull-request-url }})
      
      - name: Set job status
        if: always()
        run: |
          echo "${{ job.status }}" > "${RUNNER_TEMP}/${STATUS_FILE}"

          if ! ${{ env.REQUIRED }}; then
            echo " optional" >> "${RUNNER_TEMP}/${STATUS_FILE}"
          fi

      - name: Upload status artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: job-status-rector
          path: ${{ runner.temp }}/${{ env.STATUS_FILE }}
          retention-days: 1
